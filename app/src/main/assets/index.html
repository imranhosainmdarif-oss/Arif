<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14532d"><title>টেইলার্সের হিসাব নিকাশ</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f3;color:#17231a;font-family:system-ui,sans-serif}header{background:#14532d;color:white;padding:18px;position:sticky;top:0}h1{font-size:21px;margin:0}nav{display:flex;overflow:auto;gap:6px;padding:10px;background:white;position:sticky;top:61px}nav button,button{padding:10px;border:1px solid #dce5dd;border-radius:9px;background:white;font:inherit}nav .on,button.primary{background:#166534;color:white}main{padding:12px;max-width:800px;margin:auto}.page{display:none}.page.on{display:block}.card,form,.item{background:white;border:1px solid #dce5dd;border-radius:12px;padding:13px;margin:10px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:white;border:1px solid #dce5dd;padding:12px;border-radius:12px}.stat small{display:block;color:#617064}.stat b{font-size:19px}label{display:block;font-size:13px;margin:9px 0 4px}input,select,textarea{width:100%;padding:10px;border:1px solid #cbd8cd;border-radius:8px;font:inherit}h2{font-size:18px}.hint{font-size:12px;color:#617064;line-height:1.5}.item p{font-size:13px;color:#617064;margin:5px 0}.item h3{font-size:15px;margin:0}.empty{padding:18px;text-align:center;color:#617064}
</style></head><body><header><h1>টেইলার্সের হিসাব নিকাশ</h1><small>ব্যক্তিগত দোকানের হিসাব</small></header><nav id="nav"><button class="on" data-p="home">সারাংশ</button><button data-p="orders">অর্ডার</button><button data-p="officers">কর্মকর্তা</button><button data-p="expenses">খরচ</button><button data-p="backup">ব্যাকআপ</button></nav><main>
<section class="page on" id="home"><div class="card">এই প্রাথমিক সংস্করণে হিসাব এই ফোনে সংরক্ষিত হয়। Gmail লগইন/অনলাইন সিঙ্ক এখনো চালু নয়।</div><div class="grid" id="stats"></div><h2>সাম্প্রতিক অর্ডার</h2><div id="recent"></div></section>
<section class="page" id="orders"><h2>নতুন অর্ডার</h2><form id="orderForm"><label>তারিখ</label><input name="date" type="date" required><label>কাস্টমারের নাম</label><input name="customer" required><label>মোবাইল</label><input name="mobile" type="tel"><div class="grid"><div><label>অর্ডারের বিবরণ</label><input name="details"></div><div><label>পরিমাণ (পিস/সেট)</label><input name="qty" type="number" min="1" value="1" required></div></div><div class="grid"><div><label>মোট বিল ৳</label><input name="total" type="number" min="0" value="0" required></div><div><label>অগ্রিম ৳</label><input name="advance" type="number" min="0" value="0"></div></div><label>ডেলিভারির তারিখ</label><input name="delivery" type="date"><button class="primary">অর্ডার সংরক্ষণ</button></form><div id="ordersList"></div></section>
<section class="page" id="officers"><h2>কর্মকর্তার পাওনা/পরিশোধ</h2><form id="officerForm"><label>তারিখ</label><input name="date" type="date" required><label>নাম</label><input name="name" required><div class="grid"><div><label>পাওনা যোগ ৳</label><input name="amount" type="number" min="0" value="0"></div><div><label>মালিক পরিশোধ ৳</label><input name="paid" type="number" min="0" value="0"></div></div><label>বিবরণ</label><input name="note"><button class="primary">সংরক্ষণ</button></form><div id="officersList"></div></section>
<section class="page" id="expenses"><h2>দৈনিক আয়/খরচ</h2><form id="expenseForm"><label>তারিখ</label><input name="date" type="date" required><label>ধরন</label><select name="kind"><option>আয়</option><option>খরচ</option></select><label>বিবরণ</label><input name="note" required><label>টাকা ৳</label><input name="amount" type="number" min="0" required><button class="primary">সংরক্ষণ</button></form><div id="expensesList"></div></section>
<section class="page" id="backup"><h2>ব্যাকআপ</h2><p class="hint">JSON ব্যাকআপ ডাউনলোড করে নিরাপদে রাখুন। এটি অনলাইন সিঙ্ক নয়।</p><button class="primary" id="export">ব্যাকআপ ডাউনলোড</button><button id="importBtn">ব্যাকআপ ইমপোর্ট</button><input hidden id="importFile" type="file" accept=".json"><p><button id="clear">সব হিসাব মুছুন</button></p></section>
</main><script>
const K='tailorsHisabV1',empty=()=>({orders:[],officers:[],expenses:[]});let d;try{d={...empty(),...JSON.parse(localStorage.getItem(K)||'{}')}}catch{d=empty()}const today=()=>new Date().toISOString().slice(0,10),money=n=>'৳'+Number(n||0).toLocaleString('en-US'),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));document.querySelectorAll('input[type=date]').forEach(x=>x.value=today());document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#nav button,.page').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.getElementById(b.dataset.p).classList.add('on')});
function save(){localStorage.setItem(K,JSON.stringify(d));render()}function list(arr,fn){return arr.length?[...arr].reverse().map(o=>'<div class="item"><h3>'+esc(o.title)+' <span style="float:right">'+fn(o)+'</span></h3><p>'+esc(o.date)+' • '+esc(o.details||'')+'</p><button data-del="'+o.type+'" data-id="'+o.id+'">মুছুন</button></div>').join(''):'<div class="empty">এখনো কোনো তথ্য নেই</div>'}
function render(){let total=d.orders.reduce((s,o)=>s+o.total,0),adv=d.orders.reduce((s,o)=>s+o.advance,0),due=d.orders.reduce((s,o)=>s+o.due,0),inc=d.expenses.filter(o=>o.kind==='আয়').reduce((s,o)=>s+o.amount,0),ex=d.expenses.filter(o=>o.kind==='খরচ').reduce((s,o)=>s+o.amount,0);document.getElementById('stats').innerHTML=[['মোট অর্ডার',d.orders.length+'টি'],['মোট বিল',money(total)],['অগ্রিম',money(adv)],['বাকি পাওনা',money(due)],['মোট আয়',money(inc)],['মোট খরচ',money(ex)],['হিসাবি পার্থক্য',money(inc-ex)]].map(a=>'<div class="stat"><small>'+a[0]+'</small><b>'+a[1]+'</b></div>').join('');document.getElementById('recent').innerHTML=list(d.orders.slice(-4),o=>money(o.total));document.getElementById('ordersList').innerHTML=list(d.orders,o=>'বাকি '+money(o.due));document.getElementById('officersList').innerHTML=list(d.officers,o=>'বাকি '+money(Math.max(0,o.amount-o.paid)));document.getElementById('expensesList').innerHTML=list(d.expenses,o=>money(o.amount))}
function bind(id,arr,type,make){document.getElementById(id).onsubmit=e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target)),o=make(f);o.id=Date.now().toString()+Math.random().toString(16).slice(2);o.type=type;d[arr].push(o);save();e.target.reset();e.target.querySelectorAll('input[type=date]').forEach(x=>x.value=today());alert('সংরক্ষণ হয়েছে')}}
bind('orderForm','orders','orders',f=>{let total=+f.total||0,advance=+f.advance||0;return{date:f.date,title:f.customer,total,advance,due:Math.max(0,total-advance),details:'মোবাইল '+(f.mobile||'-')+' • '+(f.details||'')+' • '+f.qty+' পিস/সেট • ডেলিভারি '+(f.delivery||'নির্ধারিত নয়')}});
bind('officerForm','officers','officers',f=>({date:f.date,title:f.name,amount:+f.amount||0,paid:+f.paid||0,details:'পাওনা '+money(f.amount)+' • পরিশোধ '+money(f.paid)+' • '+(f.note||'')}));
bind('expenseForm','expenses','expenses',f=>({date:f.date,title:f.kind,kind:f.kind,amount:+f.amount||0,details:f.note}));
document.addEventListener('click',e=>{let b=e.target.closest('[data-del]');if(b&&confirm('এন্ট্রি মুছবেন?')){let a=b.dataset.del;d[a]=d[a].filter(o=>o.id!==b.dataset.id);save()}});
document.getElementById('export').onclick=()=>{let a=document.createElement('a'),blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download='tailors-hisab-'+today()+'.json';a.click();URL.revokeObjectURL(a.href)};document.getElementById('importBtn').onclick=()=>document.getElementById('importFile').click();document.getElementById('importFile').onchange=async e=>{try{d={...empty(),...JSON.parse(await e.target.files[0].text())};save();alert('ব্যাকআপ ইমপোর্ট হয়েছে')}catch{alert('ফাইল ঠিক নয়')}};document.getElementById('clear').onclick=()=>{if(confirm('সব হিসাব মুছে যাবে—নিশ্চিত?')){d=empty();save()}};render();
</script></body></html>
